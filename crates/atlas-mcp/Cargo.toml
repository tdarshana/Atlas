[package]
name = "atlas-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atlas-core = { path = "../atlas-core" }
rmcp = { version = "3.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
# Only for `http::request::Parts`, which the streamable HTTP transport injects into a
# request's `RequestContext::extensions` and is the only way to read the
# `Mcp-Session-Id` header from inside `call_tool` (rmcp exposes no session hook).
http = "1"
chrono.workspace = true
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: the in-memory client/server pair the access tests run over is a
# `tokio::io::duplex`, which the crate itself never needs.
tokio = { workspace = true, features = ["io-util"] }
# Test-only: an in-memory client/server round trip needs the client half of rmcp,
# which the daemon and stdio shim never link.
rmcp = { version = "3.2", features = ["client"] }
