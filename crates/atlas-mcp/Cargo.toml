[package]
name = "atlas-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atlas-core = { path = "../atlas-core" }
rmcp = { version = "3.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: an in-memory client/server round trip needs the client half of rmcp,
# which the daemon and stdio shim never link.
rmcp = { version = "3.2", features = ["client"] }
