[package]
name = "atlas-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-client = { path = "../atlas-client" }
atlas-mcp = { path = "../atlas-mcp" }
rmcp = { version = "3.2", features = ["server", "transport-io"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"

[dev-dependencies]
atlas-testkit = { path = "../atlas-testkit" }
tempfile.workspace = true
reqwest.workspace = true
# Test-only: the MCP client half plus the child-process transport, so a test can
# spawn `atlas mcp` and speak the real handshake to it, which the shim never needs.
rmcp = { version = "3.2", features = ["client", "transport-child-process"] }
