[package]
name = "atlasd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "atlasd"
path = "src/main.rs"

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-mcp = { path = "../atlas-mcp" }
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
# SEC-5: the daemon token is drawn from the OS and published as a SHA-256 in `status`.
# Both versions are already in the lock file.
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
atlas-testkit = { path = "../atlas-testkit" }
reqwest.workspace = true
# `ServiceExt::oneshot`, for the in-process handler tests in `http/handler_tests.rs`.
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
uuid.workspace = true
# Test-only: stands in for the desktop app on the plugin channel (the harness crate
# holds the stand-in itself; the tests speak its frame types).
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
