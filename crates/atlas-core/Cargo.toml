[package]
name = "atlas-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
# Scheduled workflow triggers: parses the cron expression and answers when it next fires.
cron.workspace = true
tracing.workspace = true
async-trait.workspace = true
schemars.workspace = true
duckdb = { version = "1.10505", features = ["bundled"] }
directories = "6"
fastembed = "6"
git2 = "0.21"
ignore = "0.4"
reqwest.workspace = true
# Checking an MCP server means being an MCP client: the client half of rmcp, with the
# child-process transport for a stdio server and the streamable HTTP one for a remote
# server. The server half, its macros and its schema generation are the daemon's and the
# stdio shim's, and are deliberately not enabled here.
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
# Codex's config.toml is the user's file: edited in place so comments and
# formatting survive a hook install.
toml_edit = "0.25"
# `sync` on top of the workspace features: `JobQueue` holds a `tokio::sync::Notify`.
tokio = { workspace = true, features = ["sync"] }
pulldown-cmark.workspace = true

# Skill discovery asks the kernel whether it may write a `SKILL.md` (`access(2)` with
# `W_OK`), rather than reading the readonly bit, which calls a file owned by someone
# else writable whenever anyone may write it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
toml = "0.9"
axum = "0.8"
