<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // Paint the stored theme, theme pack, fonts and UI scale before anything renders,
      // so the window never flashes the wrong ramp, colours, fonts or size. Dark is the
      // default; storage can throw when site data is blocked, and any bad value here is
      // simply skipped rather than failing the boot.
      try {
        var pack = null;
        try {
          var rawPack = localStorage.getItem('atlas.theme_pack');
          if (rawPack) pack = JSON.parse(rawPack);
        } catch (e) {
          pack = null;
        }
        var t = localStorage.getItem('atlas.theme');
        var base = pack && (pack.base === 'light' || pack.base === 'dark') ? pack.base : t === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = base;

        if (pack && pack.tokens && typeof pack.tokens === 'object') {
          var bootTokenNames = [];
          for (var k in pack.tokens) {
            if (Object.prototype.hasOwnProperty.call(pack.tokens, k) && k.indexOf('--') === 0) {
              document.documentElement.style.setProperty(k, String(pack.tokens[k]));
              bootTokenNames.push(k);
            }
          }
          // Left for theme-pack.ts to read back at startup, so a later clear (switching
          // back to Dark or Light) knows to remove what this script painted before the
          // bundle, and its own session tracking, ever existed.
          document.documentElement.dataset.themePackTokens = JSON.stringify(bootTokenNames);
        }

        var fontUiStacks = {
          system: '-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif',
          inter: 'Inter,-apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif',
          'jetbrains-mono': '"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace'
        };
        var fontMonoStacks = {
          'jetbrains-mono': '"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace',
          'system-mono': 'ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace'
        };
        // A stored value is a preset name or an installed family, which goes ahead of
        // the system stack (mirrors `fontUiStack`/`fontMonoStack` in src/lib/shell/fonts.ts).
        var quote = function (f) { return '"' + f.replace(/["\\]/g, '\\$&') + '"'; };
        var storedUi = localStorage.getItem('atlas.font_ui');
        var fontUi = storedUi && (fontUiStacks[storedUi] || quote(storedUi) + ',' + fontUiStacks.system);
        if (fontUi) document.documentElement.style.setProperty('--font-ui', fontUi);
        var storedMono = localStorage.getItem('atlas.font_mono');
        var fontMono = storedMono && (fontMonoStacks[storedMono] || quote(storedMono) + ',' + fontMonoStacks['system-mono']);
        if (fontMono) document.documentElement.style.setProperty('--font-mono', fontMono);
        var fontSize = Number(localStorage.getItem('atlas.font_size'));
        if (fontSize >= 11 && fontSize <= 16) {
          document.documentElement.style.setProperty('--text-sm', fontSize + 'px');
        }
        var monoSize = Number(localStorage.getItem('atlas.font_mono_size'));
        if (monoSize >= 10 && monoSize <= 16) {
          document.documentElement.style.setProperty('--mono-sm', monoSize + 'px');
        }
        if (localStorage.getItem('atlas.font_smoothing') === 'off') {
          document.documentElement.dataset.smoothing = 'off';
        }
        var scale = localStorage.getItem('atlas.scale');
        if (
          (scale === '80' || scale === '90' || scale === '100' || scale === '110' || scale === '125' || scale === '150') &&
          scale !== '100'
        ) {
          document.documentElement.style.zoom = String(Number(scale) / 100);
          document.documentElement.style.setProperty('--ui-zoom', String(Number(scale) / 100));
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
