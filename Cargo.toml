[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: sync merges into the user's own `.claude/settings.json`, and a
# BTreeMap-backed Map would hand back every key alphabetised.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
# Framework adapters (superpowers/openspec/speckit/gsd): parses plan, ledger and
# task-list markdown to pull out titles, headings and checkbox items.
pulldown-cmark = "0.13"
