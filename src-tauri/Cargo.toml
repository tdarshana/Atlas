[package]
name = "atlas-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the menu bar item that shows the daemon state; `image-png` decodes
# its template mark at compile time (`include_image!`).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Writing the file the save dialog named: the project Log tab's JSONL export.
tauri-plugin-fs = "2"
# The webview draws its own title bar, so it needs to know which OS chrome to draw.
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-positioner = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
# Registered in debug builds only (see `mcp_bridge_plugin` in lib.rs): the bridge the
# Tauri MCP server drives a running dev app through, on loopback port 9223.
tauri-plugin-mcp-bridge = "0.13"
# Formats an update's publish date the same way the updater plugin's own JS command
# does (`well_known::Rfc3339`), for `update_check`'s reply.
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tauri-plugin-log` installs this crate's global logger, so a warning logged here
# (the boot-time shortcut restore, when the daemon or the stored shortcut is unusable)
# reaches the same log file and webview console every other log line does.
log = "0.4"
# SEC-6: per-frame nonces for the atlas-plugin scheme. Already in the lock file.
getrandom = "0.3"
# Only the plugin installer's GitHub download, on the blocking client, since that work
# already runs inside `spawn_blocking`. Everything that talks to the daemon goes through
# `atlas-client`'s `RemoteBackend` instead (asserted by `commands::tests`).
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# The desktop app reaches Atlas only through the daemon, and starts it with the
# same `daemon_ctl` the CLI uses rather than opening the DuckDB file itself.
atlas-client = { path = "../crates/atlas-client" }
atlas-core = { path = "../crates/atlas-core" }
# Plugin manifest `version`/`api` fields and the compatibility check against
# `ATLAS_API_VERSION`.
semver = { version = "1", features = ["serde"] }
# Extracting a downloaded plugin's `.tar.gz`.
flate2 = "1"
tar = "0.4"
fontdb = "0.24.0"

[dev-dependencies]
# Enables `tauri::test` (mock runtime) for the command unit tests.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

