[package]
name = "atlas-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Writing the file the save dialog named: the project Log tab's JSONL export.
tauri-plugin-fs = "2"
# The webview draws its own title bar, so it needs to know which OS chrome to draw.
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-positioner = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
# Formats an update's publish date the same way the updater plugin's own JS command
# does (`well_known::Rfc3339`), for `update_check`'s reply.
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tauri-plugin-log` installs this crate's global logger, so a warning logged here
# (the boot-time shortcut restore, when the daemon or the stored shortcut is unusable)
# reaches the same log file and webview console every other log line does.
log = "0.4"
# The notification poller reads the daemon's HTTP API from a Rust background task.
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
# The desktop app reaches Atlas only through the daemon, and starts it with the
# same `daemon_ctl` the CLI uses rather than opening the DuckDB file itself.
atlas-client = { path = "../crates/atlas-client" }
atlas-core = { path = "../crates/atlas-core" }

[dev-dependencies]
# Enables `tauri::test` (mock runtime) for the command unit tests.
tauri = { version = "2", features = ["test"] }

